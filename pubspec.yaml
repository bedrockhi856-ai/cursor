name: study_buddy
version: 1.0.0+1
description: A personalized study companion app to help you focus and track progress.
publish_to: 'none'

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  haptic_feedback: ^0.1.0
  flutter_svg: ^2.0.9
  http: ^1.2.0
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Navigation
  go_router: ^13.2.0
  
  # Utilities
  equatable: ^2.0.5
  uuid: ^4.3.3
  
  # Supabase
  supabase_flutter: ^2.3.0
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
flutter:
  uses-material-design: true
  assets:
    - assets/background/
    - assets/illustrations/ 